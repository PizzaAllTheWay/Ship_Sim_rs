name: Autoformat Rust Code

on:
  # Trigger the workflow on pushes to the main branch
  push:
    branches:
      - main
  # Trigger the workflow on pull requests targeting any branch
  pull_request:
    branches:
      - '*'

jobs:
  autoformat:
    runs-on: ubuntu-latest  # Use the latest Ubuntu environment for the workflow

    steps:
      # Step 1: Checkout the code from the repository
      # This step checks out the repository so the workflow can access the codebase.
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GH_PAT }}  # Use the Personal Access Token (PAT) for authentication

      # Step 2: Install Rust using the actions-rs toolchain
      # Sets up a stable Rust environment for formatting the code.
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable  # Install the stable version of Rust
          profile: minimal   # Install only essential components for minimal setup

      # Step 3: Format code using rustfmt
      # This step runs `cargo fmt` to apply Rust's standard code formatting rules to the repository.
      - name: Format code using rustfmt
        run: cargo fmt

      # Step 4: Commit and Push formatted code back to the repository
      # Commits and pushes any formatting changes made by `cargo fmt` to the repository.
      - name: Commit and Push formatted code
        env:
          GH_PAT: ${{ secrets.GH_PAT }}  # Use the PAT for authentication when pushing changes
        run: |
          # Configure Git with a name and email for the commit
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          # Stage all changes made by rustfmt
          git add .

          # Commit changes if any files were modified
          git diff-index --quiet HEAD || git commit -m "Autoformat code with rustfmt"

          # Set the remote URL with the PAT and push changes to the repository
          git remote set-url origin https://${GH_PAT}@github.com/${{ github.repository }}
          git push origin HEAD:refs/heads/${{ github.ref_name }}

