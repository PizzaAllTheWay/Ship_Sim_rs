[ship]
simulation_frequency = 100.00 # [Hz]
mass = 10000.0 # [kg]
dimensions = [10.0, 30.0] # [m] (radius, length) Assume ship is a cylinder
thruster_placement = [-15.0, 0.0, -10.0] # [m] (x, y, z) Back bottom of the ship
thruster_rpm_max = 500 # [rpm]
velocity_linear_max = 20.00 # [m/s] Maximum linear speed the ship can reach 
velocity_angular_max = 0.15  # [rad/s] Maximum angular speed the ship can reach 
x_0 = [
    0.0, 0.0,   0.0, # [vx, vy, vz]
    0.0, 0.0,   0.0, # [wx, wy, wz]
    0.0, 0.0,   0.0, # [x, y, z]
    0.0, 0.0,  1.57, # [roll, pitch, yaw] (PI/2 to face forward in Y axis)
]

[interface]
fps = 60.0 # [Hz]

[external_forces]
simulation_frequency = 50.00 # [Hz]
wind_speed_max = 22.0 # [m/s] Comparable to a strong Gale 
current_speed_max = 3.0 # [m/s] Comparable to tidal currents near a shore 

[sensors]
# Assuming a good consumer grade GNSS
gnss_pub_frequency = 1.00 # [Hz]
gnss_pub_variance = 0.1 # [%] variation in publishing frequency
# ?NOTE: NED Frame right hand rule. Must place Antenna1 in front and Antenna2 behind otherwise Estimator will confuse front and back antennas and you will get weird estimate :/
gnss_antenna1_placement = [-10.0, 0.0, -3.0] # [m] (x, y, z) (Placement: Forward) placement of the antenna relative to the center of mass on the ship body frame
gnss_antenna2_placement = [10.0, 0.0, -3.0] # [m] (x, y, z) (Placement: Backwards) placement of the antenna relative to the center of mass on the ship body frame 
# ?NOTE: Since most Satellites orbit around equator, most likely satellite for GNSS will be from this group of satellites, this means they are more accurate horizontally than vertically 
# ?NOTE: Horizontal => XY Plane
# ?NOTE: Vertical => Z Direction (UP/DOWN)
gnss_position_noise_horizontal = 0.15 # [%]
gnss_position_accuracy_horizontal = 3.0 # +- [m]
gnss_position_noise_vertical = 0.25 # [%]
gnss_position_accuracy_vertical = 5.5 # +- [m]
gnss_velocity_noise_horizontal = 0.1 # [%]
gnss_velocity_accuracy_horizontal = 0.2 # +- [m/s]
gnss_velocity_noise_vertical = 0.2 # [%]
gnss_velocity_accuracy_vertical = 0.4 # +- [m/s]

# Assuming a good consumer grade IMU
# ?NOTE: IMU publishes at same frequency as the ship simulation frequency ([ship] simulation_frequency)
# ?NOTE: Because of how Interface portrays information and because of the right hand rule of NED frame, the IMU must be rotate by YAW 180 [deg] or pi [rad] in order for it to keep consistent with positive x and y directions
imu_placement = [0.0, 0.0, 0.0] # [m] (x, y, z) NOTE: relative to ships frame
imu_rotation = [0.0, 0.0, 3.14] # [rad] (roll, pitch, yaw) NOTE: relative to its own internal frame (Placement: Forward Looking) placement of the IMU relative to the center of mass on the ship body frame
imu_noise = 0.30 # [%]
imu_accel_noise = 0.05 # [m/s²]
imu_gyro_noise = 0.005 # [rad/s / h]
imu_mag_noise = 0.02 # [rad / h]
imu_resolution = 16 # [bit]
imu_accel_fsr = 16.0 # [m/s²] full scale resolution
imu_gyro_fsr = 17.45 # [rad/s] full scale resolution
imu_mag_fsr = 6.28 # [rad] full scale resolution

[estimators]
kf_pub_frequency = 100.00 # [Hz]
# ?NOTE: Never have 0.0 in P_0, as that indicates we are 100% confident in our model from the start, this means we would not trust the measurements as the estimator would assume we already have perfect model, witch we don't
P_0 = [
    0.5, 0.5, 0.1, # Uncertainty: [vx, vy, vz]
    0.1, 0.1, 0.5, # Uncertainty: [wx, wy, wz]
    1.0, 1.0, 0.1, # Uncertainty: [x, y, z]
    0.1, 0.1, 0.5, # Uncertainty: [roll, pitch, yaw]
]

# ?NOTE: Usually we don't trust the process data our model gives us (Q) as much as the measurement data sensors gives us (R), so Q > R, also Q needs manual tuning while R can be decided just by measurement variance and covariance 
Q = [
    10.0, 10.0, 10.0, # Model trust in: [vx, vy, vz]
    10.0, 10.0, 10.0, # Model trust in: [wx, wy, wz]
    5.0, 5.0, 5.0, # Model trust in: [x, y, z]
    5.0, 5.0, 5.0, # Model trust in: [roll, pitch, yaw]
]

# ?NOTE: Assume linearity, assume no 2 measurement states can affect each other, no covariance, only variance, ie diagonal matrix. Values calculated from measurement variance
R_gnss = [
    1.600936, 1.619552, 5.448326, # Measurement trust in: antenna1 [x, y, z]
    1.560227, 1.512290, 5.518882, # Measurement trust in: antenna2 [x, y, z]
    0.824833, 0.824833, 1.096953, # Measurement trust in: velocity [vx, vy, vz]
]

R_imu = [
    0.0000000782507343, 0.0000008236971636, 0.0000001261186860, # Measurement trust in: accelerometer [ax, ay, az]
    0.0000000001637147, 0.0000000002326225, 0.0000000001378617, # Measurement trust in: gyroscope [wx, wy, wz]
    0.0000000096122428,                                         # Measurement trust in: magnetometer [yaw]
]
imu_drift = [
    0.0000028790977229, 0.0000103167668384, 0.0000672533558569, # accelerometer drift [m/s²] 
    0.0000003081781019, 0.0000000021636393, 0.0000002311335764, # gyroscope drift [rad/s]
    0.0000081211093400,                                         # magnetometer drift [rad]
]

